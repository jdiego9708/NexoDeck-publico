[package]
name = "nexodeck-notify"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
serde = { workspace = true }
serde_json = "1"
thiserror = "2.0.18"
# `process` para tokio::process::Command, `io-util` para escribir el mensaje
# por stdin, `time` para el timeout de entrega. `rt` alcanza: las tareas
# corren en el runtime que ya levanta frb, igual que en nexodeck-actions.
tokio = { version = "1", features = ["rt", "time", "process", "io-util"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
